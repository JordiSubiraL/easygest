services:
  postgres:
    image: postgres:17
    container_name: easygest-postgres
    labels:
      org.springframework.boot.ignore: "true"
    environment:
      POSTGRES_USER: super-easygest
      POSTGRES_PASSWORD: super-easygest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U super-easygest"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Los servicios solo se levantan con el perfil "apps":
  #   docker compose --profile apps up --build -d
  # Para añadir otro servicio, copia este bloque y cambia SERVICE, la base
  # de datos en las dos URLs, el nombre del contenedor y el puerto.
  customer-service:
    profiles: [ "apps" ]
    build:
      context: .
      args:
        SERVICE: customer-service
    container_name: easygest-customer-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/customer_db
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/customer_db
    ports:
      - "8081:8081"
volumes:
    postgres_data: